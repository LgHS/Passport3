services:
  passport3:
    container_name: passportv3
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8030:8030'
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - passport3-data:/app/data
    restart: always
    # Hardening: the image itself is read-only, only the data volume (and a small /tmp for
    # incidental temp files) is writable — a compromised process can't alter the app code or plant
    # files elsewhere. No Linux capabilities and no privilege escalation (the app runs as `passport`).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-alpine
    container_name: passport3-postgres
    # Only the three vars it actually needs, not the whole `.env` (env_file would also inject every
    # other secret in there — Authentik/Dolibarr/GitHub/Mattermost tokens — into a container that
    # has no use for any of them).
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - passport3-postgres-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  passport3-data:
  passport3-postgres-data:
