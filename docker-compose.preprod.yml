services:
  passport3:
    image: ghcr.io/lghs/passport3:preprod
    container_name: passportv3
    ports:
      - '8030:8030'
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - passport3-data:/app/data
    restart: always
    # Hardening: the image itself is read-only, only the data volume (and a small /tmp for
    # incidental temp files) is writable — a compromised process can't alter the app code or plant
    # files elsewhere. No Linux capabilities and no privilege escalation (the app runs as `passport`).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # No `ports:` here, unlike docker-compose.yml's local-dev copy of this same service — never
  # exposed on the host in preprod, the internal Docker network is all `passport3` needs.
  postgres:
    image: postgres:17-alpine
    container_name: passport3-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - passport3-postgres-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --label-enable --cleanup
    restart: always

volumes:
  passport3-data:
  passport3-postgres-data:
