name: Build and push release image

# Triggered by pushing a version tag (e.g. `v0.0.1`), which is what `gh release create`
# does under the hood — keeps "cut a release" and "build+push the image" as a single action.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Keeps package.json (baked into the image at build time, e.g. the footer's
      # version link) in sync with the release tag, since `gh release create` doesn't
      # touch it on its own.
      - name: Sync package.json version with release tag
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # `preprod` is the moving tag preprod's deploy tooling watches for updates — every
          # version release currently promotes straight to preprod (no separate prod tag yet).
          tags: |
            ghcr.io/lghs/passport3:${{ steps.version.outputs.version }}
            ghcr.io/lghs/passport3:preprod
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The tag itself (checked out above) still points at the pre-bump commit — this
      # lands the bumped version on main so it's the baseline for the next release.
      - name: Commit version bump to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:main
