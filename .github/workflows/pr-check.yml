name: PR checks

# Runs on every pull request, whatever its target branch — separate from docker-release.yml
# (triggered by version tags only), never touches main directly and never pushes the Docker
# image. Not filtered to `branches: main`: this project relies heavily on stacked PRs
# (a feature branch targeting another feature branch, not main directly), and GitHub evaluates
# this trigger filter using the workflow file on the repo's default branch regardless of which
# branch a given PR targets — so a `branches: main` filter here would silently never run at all
# for any stacked PR, leaving a required check permanently pending instead of just skipped.
on:
  pull_request:

permissions:
  contents: read

# A new push to the same PR makes the previous run pointless — cancel it instead of queueing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Same mechanism as the Dockerfile's own `RUN corepack enable` — respects the pnpm version
      # pinned in package.json's `packageManager` field, no separate pnpm-specific action needed.
      - name: Enable pnpm via corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      # Catches what type-check alone can't: server-only code leaking into the client bundle,
      # build-time env vars ($env/static/*), or anything else that only breaks at actual
      # compilation. No secrets needed — verified locally that `pnpm build` succeeds with an
      # empty environment.
      - name: Build
        run: pnpm build

  # Builds the same image docker-release.yml would publish (without pushing it), starts it, and
  # scans it — a broken Dockerfile or a crash at startup otherwise only surfaces when a release
  # tag is cut.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: passport3:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No env at all: the app must still boot and serve its anonymous landing page (verified
      # locally with an empty environment, same as the Build step above) — anything >= 500, or
      # no answer within 30s, fails the job.
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8030:8030 passport3:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8030/ || true)
            if [ "$code" != "000" ]; then break; fi
            sleep 1
          done
          docker logs smoke
          echo "GET / -> $code"
          [ "$code" -ge 200 ] && [ "$code" -lt 500 ]

      # Only fails on HIGH/CRITICAL vulnerabilities that already have a fix available — an
      # unfixable CVE in the base image would otherwise block every PR with nothing to act on.
      # The global node_modules (the npm bundled with the Node base image, plus corepack installed
      # from it) is skipped: the app never runs them, and their CVEs can only be fixed upstream by
      # a new Node image — Dependabot's docker updates bring those in. The app's own dependencies
      # under /app/node_modules are still scanned.
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: passport3:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: /usr/local/lib/node_modules
          exit-code: '1'
